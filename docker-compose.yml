# Optional. systemd on the host is lighter and is what the README assumes —
# this exists if you'd rather keep the Pi's system Python untouched.
#
# Note the collectors are NOT in here: they're short-lived jobs, and a container
# that exists only to run a cron loop is worse than a systemd timer. Keep the
# timers on the host and point them at `docker compose run`, or drop Docker.
services:
  web:
    build: .
    container_name: finoverview-web
    restart: unless-stopped
    # Loopback only. Tailscale handles exposure and TLS.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3

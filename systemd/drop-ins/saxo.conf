# Observed in practice: the live refresh token dies in ~1h, not the ~24h the
# Saxo docs and this app's own comments used to assume — a 4-hourly schedule
# reliably misses that window and kills the connection overnight. Every 15
# minutes gives real margin against a missed/failed run before the token dies.
[Timer]
OnCalendar=
OnCalendar=*-*-* *:0/15:00

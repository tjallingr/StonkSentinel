[project]
name = "finance-overview"
version = "0.1.0"
description = "Self-hosted balances, net worth, portfolio performance and projections"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.2",
    "PyJWT[crypto]>=2.9",
    "fastapi>=0.115",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "numpy>=2.0",
    "tomlkit>=0.13",
]

[project.scripts]
finoverview = "finoverview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finoverview = ["schema.sql", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

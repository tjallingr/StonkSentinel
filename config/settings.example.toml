# Copy to settings.toml. Secrets can also go in env vars (env wins).

[general]
db_path       = "data/finance.db"
base_currency = "EUR"
secrets_dir   = "secrets"

[general.stale_after_hours]
saxo          = 8
enablebanking = 30
fx            = 30
manual        = 960

[enablebanking]
app_id           = ""                              # or env ENABLEBANKING_APP_ID
private_key_path = "secrets/enablebanking.pem"     # or env ENABLEBANKING_KEY_PATH
# Must match a registered redirect URL exactly. Browser will error — copy ?code= from the bar.
redirect_url = "https://localhost:8080/eb/callback"

# Names must match Enable Banking ASPSP list: python -m finoverview.auth.eb_link --list --country NL
[[enablebanking.banks]]
name    = "Rabobank"
country = "NL"

[[enablebanking.banks]]
name    = "KBC"
country = "BE"

[saxo]
live         = true
app_key      = ""                                  # or env SAXO_APP_KEY
app_secret   = ""                                  # or env SAXO_APP_SECRET
redirect_url = "http://localhost:8080/saxo/callback"

# Copy to assets.toml. No secrets here — safe to commit in a private repo.

[[asset]]
key         = "car"
label       = "Car"
kind        = "vehicle"
value       = 14500.00
currency    = "EUR"
liquid      = false
as_of       = "2026-07-01"

[[asset]]
key         = "cash-emergency"
label       = "Cash at home"
kind        = "other"
value       = 500.00
currency    = "EUR"
liquid      = true

# Give a manual account its IBAN and the expenses page stops counting money you
# move into it as spending. Only needed for accounts Enable Banking can't see —
# linked accounts learn their own IBAN on the first collect.
[[asset]]
key         = "crelan-savings"
label       = "Crelan savings"
kind        = "savings"
value       = 7000.00
currency    = "EUR"
liquid      = true
iban        = "BE00000000000000"

# Liabilities: negative value.
[[asset]]
key         = "mortgage"
label       = "Mortgage"
kind        = "other"
value       = -182000.00
currency    = "EUR"
liquid      = false

# Keys are "provider:external_id" — collectors print these on first run.
[account_override."enablebanking:REPLACE_WITH_KBC_SAVINGS_UID"]
label      = "KBC savings (collateral)"
kind       = "savings"
encumbered = true

[account_override."enablebanking:REPLACE_WITH_RABO_SAVINGS_UID"]
label = "Rabobank savings"
kind  = "savings"

[[recurring]]
key      = "salary"
label    = "Salary, net"
kind     = "income"
amount   = 3400.00
currency = "EUR"
period   = "monthly"

[[recurring]]
key      = "rent"
label    = "Rent"
kind     = "cost"
amount   = 1150.00
currency = "EUR"
period   = "monthly"
category = "housing"

[[recurring]]
key      = "insurance-health"
label    = "Health insurance"
kind     = "cost"
amount   = 149.00
currency = "EUR"
period   = "monthly"
category = "insurance"

[[recurring]]
key      = "insurance-car"
label    = "Car insurance"
kind     = "cost"
amount   = 520.00
currency = "EUR"
period   = "yearly"
category = "insurance"

# Cash flows needed for correct TWR/MWR. Positive = into portfolio.
[[cash_flow]]
id       = "2026-01-15-deposit"
account  = "Saxo 12345678"
date     = "2026-01-15"
amount   = 5000.00
currency = "EUR"
kind     = "deposit"
note     = "annual lump sum"

[[cash_flow]]
id       = "2026-04-02-deposit"
account  = "Saxo 12345678"
date     = "2026-04-02"
amount   = 1000.00
currency = "EUR"
kind     = "deposit"

# Per-asset rates are REAL returns (after inflation), so the projection is in
# today's purchasing power. inflation_pct is used only to restate that in nominal
# terms on the projection page — it is a forward assumption, not a measurement,
# and it cannot be derived from the collected FX rates (those convert between
# currencies, not between purchasing power in different years). 2.0 is the ECB
# target. years and inflation_pct are editable from the app.
[projection]
years                    = 25
inflation_pct            = 2.0
expected_real_return_pct = 5.0
volatility_pct           = 15.0
contribution_growth_pct  = 1.0
paths                    = 10000
seed                     = 42

# Saxo holdings bucketed by symbol for per-category projection yields.
[[saxo_projection_category]]
key                      = "world_equity"
label                    = "World Equity ETF"
expected_real_return_pct = 5.0
symbols                  = ["IWDA"]

[[saxo_projection_category]]
key                      = "em_equity"
label                    = "Emerging Markets ETF"
expected_real_return_pct = 4.0
symbols                  = ["IEMA"]

[[saxo_projection_category]]
key                      = "bonds"
label                    = "Bonds"
expected_real_return_pct = 1.5
symbols                  = ["GERMANY-0.5-15AUG27"]

[[saxo_projection_category]]
key                      = "cash"
label                    = "Cash"
expected_real_return_pct = 0.0
symbols                  = []
